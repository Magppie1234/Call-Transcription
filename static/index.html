<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call Transcription Demo</title>
<style>
body { font-family: Arial, sans-serif; max-width: 960px; margin: 2rem auto; padding: 1rem; }
h1 { color: #333; }
button { background: #007bff; color: white; border: none; padding: .5rem 1rem; margin: .25rem; cursor: pointer; }
button:hover { background: #0056b3; }
.code { background: #f4f4f4; padding: .5rem; font-family: monospace; font-size: .85rem; }
.response { background: #eef; padding: 1rem; margin-top: 1rem; white-space: pre-wrap; }
.status { padding: .5rem; margin: .5rem 0; }
.ok { background: #d4edda; color: #155724; }
.err { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>
<h1>Call Transcription Pipeline Demo</h1>
<p>Test the backend discovery and volume measurement endpoints.</p>

<div>
<button onclick="runEndpoint('health')">Test Health</button>
<button onclick="runEndpoint('discover')">Run Discovery</button>
<button onclick="runEndpoint('volume')">Measure Volume</button>
<button onclick="runEndpoint('calls')">Get Calls Sample</button>
</div>

<div id="status"></div>
<div id="output" class="response"></div>

<script>
async function runEndpoint(endpoint) {
    const out = document.getElementById('output');
    const status = document.getElementById('status');
    out.textContent = 'Loading...';
    status.innerHTML = '';
    try {
        const res = await fetch(`/${endpoint}`);
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
        status.className = res.ok ? 'status ok' : 'status err';
        status.textContent = res.ok ? 'Success' : 'Error';
    } catch (e) {
        out.textContent = e.message;
        status.className = 'status err';
        status.textContent = 'Network error';
    }
}
</script>
</body>
</html>
